stages:
  - verify
  - build
  - release

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

variables:
  PNPM_VERSION: "12.6.0"

default:
  image: node:26
  interruptible: true
  cache:
    key:
      files:
        - apps/web/pnpm-lock.yaml
    paths:
      - apps/web/.pnpm-store/
  before_script:
    - cd apps/web
    - npm install --global "pnpm@${PNPM_VERSION}"
    - pnpm install --frozen-lockfile --store-dir .pnpm-store

code_quality:
  stage: verify
  script:
    - pnpm run format:check
    - pnpm run lint:gitlab
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      codequality: apps/web/gitlab-oxlint-report.json

test:
  stage: verify
  script:
    - >-
      pnpm run test:coverage --coverage.reporter=text-summary --coverage.reporter=cobertura --reporter=default --reporter=junit --outputFile.junit=.ci-reports/junit.xml
  coverage: '/Lines\s*:\s*\d+(?:\.\d+)?%/'
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: apps/web/.ci-reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: apps/web/coverage/cobertura-coverage.xml

build:
  stage: build
  dependencies: []
  script:
    - pnpm run build
  artifacts:
    paths:
      - apps/web/dist/
    expire_in: 1 week

release:
  stage: release
  interruptible: false
  dependencies: []
  variables:
    GIT_DEPTH: "0"
    GIT_STRATEGY: clone
    VP_GIT_HOOKS: "0"
  resource_group: release
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH" --tags
    - |
      if [ "$(git rev-parse FETCH_HEAD)" != "$CI_COMMIT_SHA" ]; then
        echo "Skipping release because the default branch advanced during this pipeline."
        exit 0
      fi
    - pnpm exec semantic-release
  rules:
    - if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"
