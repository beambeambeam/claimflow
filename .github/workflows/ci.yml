name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  code_quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: bun run format:check
      - run: bun run lint:github

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - run: >-
          bun run test:coverage --coverage.reporter=text-summary --coverage.reporter=cobertura --reporter=default --reporter=junit --outputFile.junit=.ci-reports/junit.xml
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            apps/web/.ci-reports/
            apps/web/coverage/
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/*.sum
      - name: Check modules are tidy
        run: |
          go mod tidy -diff
          go mod tidy -modfile=tools.mod -diff
          go mod tidy -modfile=golangci-lint.mod -diff
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
          working-directory: apps/api
      - name: Test
        run: >-
          go tool -modfile=tools.mod gotestsum --junitfile .ci-reports/junit.xml -- -race -coverprofile=coverage.out ./...
      - name: Check coverage
        run: go tool -modfile=tools.mod go-test-coverage --config=.testcoverage.yml
      - name: Check vulnerabilities
        run: go tool -modfile=tools.mod govulncheck ./...
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-test-reports
          path: |
            apps/api/.ci-reports/
            apps/api/coverage.out
          retention-days: 7
      - name: Build Docker image
        run: docker build --tag karupan-api .

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/*.sum
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: |
            apps/web/dist/
            apps/api/dist/
          retention-days: 7

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [code_quality, test, api, build]
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version-file: .node-version
          cache: true
      - name: Skip if main advanced
        id: head
        run: |
          git fetch origin main --tags
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "Skipping release because the default branch advanced during this workflow."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.head.outputs.stale != 'true'
        run: bunx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
