# air live reload: https://github.com/air-verse/air
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ."
entrypoint = ["./tmp/api"]
include_ext = ["go"]
exclude_dir = ["dist", "tmp"]
exclude_regex = ["_test\\.go$"]
delay = 200
stop_on_error = true
send_interrupt = true

[misc]
clean_on_exit = true
