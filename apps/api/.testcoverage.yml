# go-test-coverage: https://github.com/vladopajic/go-test-coverage
# Mark untestable blocks with a `// coverage-ignore` comment.
profile: coverage.out
threshold:
  file: 100
  package: 100
  total: 100
exclude:
  paths:
    # Generated code: varlock (.env.schema), oapi-codegen (openapi.yaml), and sqlc (queries.sql).
    - ^env/
    - ^internal/api/
    - ^internal/db/
