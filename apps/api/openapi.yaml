openapi: 3.0.3
info:
  title: ClaimFlow API
  version: 0.1.0
  description: >-
    The contract between apps/web and apps/api (SDS §4). Every error response is an RFC 9457 problem (`application/problem+json`).
servers:
  - url: /api/v1
tags:
  - name: system
    description: Liveness and readiness
  - name: auth
    description: Sign-in and the current user
  - name: claims
    description: Submit and read claims
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness. Does not use the database.
      tags: [system]
      security: []
      responses:
        "200":
          description: The API process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /ready:
    get:
      operationId: getReady
      summary: Readiness. Returns 503 when the database is unreachable.
      tags: [system]
      security: []
      responses:
        "200":
          description: The API can reach the database.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ready"
        "503":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Check the username and password, then start a session.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: The user is signed in. The session cookie is set (F-01 §3.3).
          headers:
            Set-Cookie:
              description: The session cookie. `__Host-sid` when COOKIE_SECURE is true, else `sid`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserEnvelope"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/logout:
    post:
      operationId: logout
      summary: End the current session. The session row is deleted and the cookie is cleared.
      tags: [auth]
      responses:
        "204":
          description: The session ended. The cookie is cleared with Max-Age=0 (F-01 §3.3).
          headers:
            Set-Cookie:
              description: The session cookie name with an empty value and `Max-Age=0`.
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /auth/me:
    get:
      operationId: getMe
      summary: The user of the current session. Requires a session cookie.
      tags: [auth]
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserEnvelope"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /claims:
    post:
      operationId: createClaim
      summary: Create a claim and submit it for review (F-02). Sprint 1 always submits.
      description: >-
        Needs the `claim:create` route permission, and an assigned reviewer (BR-15). The server calculates the total and ignores any `total` in the request (BR-08).
      tags: [claims]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimInput"
      responses:
        "201":
          description: The claim is stored with status `SUBMITTED`.
          headers:
            ETag:
              description: The claim's `version` in quotes, such as `"0"`.
              required: true
              schema:
                type: string
            Location:
              description: The path of the new claim, `/api/v1/claims/{id}`.
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimEnvelope"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: An RFC 9457 problem.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The release tag or git SHA from APP_VERSION.
    Ready:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          description: >-
            1–72 bytes of UTF-8, the bcrypt input limit. maxLength counts characters, so it is only an upper bound; the server and the web client also check the byte length.
          minLength: 1
          maxLength: 72
    CurrentUser:
      type: object
      required: [id, username, name, role, permissions]
      properties:
        id:
          type: string
          example: 0192f1c4-7b2e-7c3a-9d41-3f0a6b8e2c11
        username:
          type: string
          example: req.anan
        name:
          type: string
          example: Anan K.
        role:
          type: string
          enum: [requester, reviewer, finance]
          x-enum-varnames: [RoleRequester, RoleReviewer, RoleFinance]
        permissions:
          type: object
          description: Actions the role grants, keyed by resource (F-01 §1.6).
          additionalProperties:
            type: array
            items:
              type: string
          example:
            claim: [create, list]
    CurrentUserEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CurrentUser"
    Money:
      type: string
      description: An amount in THB with exactly 2 decimals, such as `1250.00`. Decoded into `money.Satang`.
      pattern: '^\d{1,6}\.\d{2}$'
      example: "1250.00"
      x-go-type: money.Satang
      x-go-type-import:
        path: github.com/beambeambeam/claimflow/apps/api/internal/money
    ExpenseCategory:
      type: string
      enum: [TRAVEL, ACCOMMODATION, MEALS, SUPPLIES, TRAINING, OTHER]
      x-enum-varnames:
        [
          ExpenseCategoryTravel,
          ExpenseCategoryAccommodation,
          ExpenseCategoryMeals,
          ExpenseCategorySupplies,
          ExpenseCategoryTraining,
          ExpenseCategoryOther,
        ]
    ClaimStatus:
      type: string
      enum:
        [
          DRAFT,
          SUBMITTED,
          RETURNED,
          PENDING_FINANCE,
          APPROVED,
          REJECTED,
          WITHDRAWN,
        ]
      x-enum-varnames:
        [
          ClaimStatusDraft,
          ClaimStatusSubmitted,
          ClaimStatusReturned,
          ClaimStatusPendingFinance,
          ClaimStatusApproved,
          ClaimStatusRejected,
          ClaimStatusWithdrawn,
        ]
    ClaimAction:
      type: string
      enum:
        [
          SUBMIT,
          APPROVE,
          REJECT,
          RETURN,
          RESUBMIT,
          WITHDRAW,
          FINAL_APPROVE,
          FINAL_REJECT,
        ]
      x-enum-varnames:
        [
          ClaimActionSubmit,
          ClaimActionApprove,
          ClaimActionReject,
          ClaimActionReturn,
          ClaimActionResubmit,
          ClaimActionWithdraw,
          ClaimActionFinalApprove,
          ClaimActionFinalReject,
        ]
    LineItemInput:
      type: object
      required: [category, description, expenseDate, amount, receiptRef]
      properties:
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        description:
          type: string
          minLength: 1
          maxLength: 200
        expenseDate:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        receiptRef:
          type: string
          minLength: 1
          maxLength: 50
    ClaimInput:
      type: object
      description: The line-item count and every business limit are checked by the claim module (422), not by this schema. Unknown fields, including `total`, are ignored (BR-08).
      required: [title, purpose, items]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        purpose:
          type: string
          minLength: 1
          maxLength: 1000
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItemInput"
    MemberSummary:
      type: object
      required: [id, name, position]
      properties:
        id:
          type: string
        name:
          type: string
          example: Anan K.
        position:
          type: string
          example: Staff, Section A
    LineItem:
      type: object
      required: [lineNo, category, description, expenseDate, amount, receiptRef]
      properties:
        lineNo:
          type: integer
          minimum: 1
          maximum: 20
        category:
          $ref: "#/components/schemas/ExpenseCategory"
        description:
          type: string
        expenseDate:
          type: string
          format: date
        amount:
          $ref: "#/components/schemas/Money"
        receiptRef:
          type: string
    HistoryEntry:
      type: object
      required: [id, action, fromStatus, toStatus, actor, comment, createdAt]
      properties:
        id:
          type: integer
          format: int64
        action:
          $ref: "#/components/schemas/ClaimAction"
        fromStatus:
          allOf:
            - $ref: "#/components/schemas/ClaimStatus"
          nullable: true
        toStatus:
          $ref: "#/components/schemas/ClaimStatus"
        actor:
          $ref: "#/components/schemas/MemberSummary"
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    Claim:
      type: object
      required:
        [
          id,
          claimNo,
          status,
          title,
          purpose,
          total,
          returnCount,
          version,
          requester,
          assignedReviewer,
          firstSubmittedAt,
          submittedAt,
          decidedAt,
          createdAt,
          updatedAt,
          items,
          history,
          allowedActions,
        ]
      properties:
        id:
          type: string
        claimNo:
          type: string
          example: CLM-2026-000123
        status:
          $ref: "#/components/schemas/ClaimStatus"
        title:
          type: string
        purpose:
          type: string
        total:
          $ref: "#/components/schemas/Money"
        returnCount:
          type: integer
        version:
          type: integer
        requester:
          $ref: "#/components/schemas/MemberSummary"
        assignedReviewer:
          allOf:
            - $ref: "#/components/schemas/MemberSummary"
          nullable: true
        firstSubmittedAt:
          type: string
          format: date-time
          nullable: true
        submittedAt:
          type: string
          format: date-time
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItem"
        history:
          type: array
          items:
            $ref: "#/components/schemas/HistoryEntry"
        allowedActions:
          type: array
          description: The actions this actor may take on this claim now (SDS §5.2). Empty until F-03 and F-04.
          items:
            type: string
    ClaimEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Claim"
    ProblemCode:
      type: string
      description: A stable error code for the client (SDS §4.2).
      enum:
        - BAD_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - INVALID_TRANSITION
        - CONFLICT
        - VALIDATION_FAILED
        - PRECONDITION_REQUIRED
        - INTERNAL
        - UNAVAILABLE
      x-enum-varnames:
        - ProblemCodeBadRequest
        - ProblemCodeUnauthenticated
        - ProblemCodeForbidden
        - ProblemCodeNotFound
        - ProblemCodeInvalidTransition
        - ProblemCodeConflict
        - ProblemCodeValidationFailed
        - ProblemCodePreconditionRequired
        - ProblemCodeInternal
        - ProblemCodeUnavailable
    FieldError:
      type: object
      required: [field, rule, message]
      properties:
        field:
          type: string
          example: username
        rule:
          type: string
          example: required
        message:
          type: string
          example: Enter your username.
    Problem:
      type: object
      description: RFC 9457 problem details with the `code`, `requestId`, and `errors` extensions.
      required: [type, title, status, code, instance, requestId]
      properties:
        type:
          type: string
          enum: [about:blank]
          x-enum-varnames: [ProblemTypeAboutBlank]
        title:
          type: string
          example: Invalid username or password.
        status:
          type: integer
          example: 401
        code:
          $ref: "#/components/schemas/ProblemCode"
        instance:
          type: string
          description: The request path.
          example: /api/v1/auth/login
        requestId:
          type: string
          description: The `X-Request-Id` of the response. The server log line uses the same value.
          example: 0192f1c4-7b2e-7c3a-9d41-3f0a6b8e2c11
        errors:
          type: array
          description: Present only when a field can be named.
          items:
            $ref: "#/components/schemas/FieldError"
